[project]
name = "cartana-api-py"
version = "0.1.0"
description = "Cartana backend (Python/FastAPI migration)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2.3,<4",
    "pgvector>=0.3.6,<0.4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "celery>=5.4,<6",
    "redis>=5.2,<6",
    "python-multipart>=0.0.12",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1.0.1",
    "pdfplumber>=0.11.0,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
