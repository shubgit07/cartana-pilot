[project]
name = "cartana-api-py"
version = "0.1.0"
description = "Cartana backend (Python/FastAPI migration)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2.3,<4",
    "pgvector>=0.3.6,<0.4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "arq>=0.25",
    "python-multipart>=0.0.12",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1.0.1",
    "pdfplumber>=0.11.0,<0.12",
    "qdrant-client>=1.11.0",
    "langgraph>=0.2.45,<0.3.0",
    "langchain-core>=0.3.15,<0.4.0",
    "boto3>=1.34.0,<1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "moto[s3]>=5.0.0",
    "ruff>=0.16,<0.17",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:botocore",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
