services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cartana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartana
      POSTGRES_PASSWORD: cartana
      POSTGRES_DB: cartana
    ports:
      - "5432:5432"
    volumes:
      - cartana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartana -d cartana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cartana-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cartana-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cartana-postgres-data:
  cartana-redis-data: